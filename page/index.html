<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paiir News · News you care about</title>
<meta name="description" content="Startup and tech news from trusted sources, every hour. One story at a time: swipe up for the next, swipe left for the full story. Easy on your eyes.">
<meta name="theme-color" content="#F3F4F6">
<link rel="icon" href="{{PATH}}brand/paiir-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{PATH}}brand/paiir-app-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Paiir News">
<meta property="og:title" content="Paiir News · News you care about">
<meta property="og:description" content="Startup and tech news from trusted sources, every hour. One story at a time, easy on your eyes.">
<meta property="og:image" content="{{BASE}}/brand/og-default.png">
<meta property="og:url" content="{{BASE}}/">
<meta name="twitter:card" content="summary_large_image">
<!-- the reading light before the first paint: the reader's choice, else paiir.in's dark mode, else the phone's setting -->
<script>(function () { var l = 'light', d = document.documentElement; try { l = localStorage.getItem('paiir-news-light') || (localStorage.getItem('paiir-news-dim') === '1' || localStorage.getItem('paiirScheme') === 'dark' ? 'dim' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dim' : 'light')); } catch (e) {} if (!/^(light|dim|warm)$/.test(l)) l = 'light'; d.setAttribute('data-light', l); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = { light: '#F3F4F6', dim: '#0F1115', warm: '#F0E7D8' }[l]; })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap">
<link rel="preconnect" href="https://wsrv.nl">
<link rel="stylesheet" href="{{PATH}}reader.css?v={{V}}">
</head>
<body>
<a class="skip" href="#deck">Skip to the stories</a>
<header class="bar">
  <a class="bar-id" href="{{PATH}}" aria-label="Paiir News, back to the first story" data-top><img src="{{PATH}}brand/paiir-mark.svg" alt="" width="30" height="30"><b>News</b></a>
  <span class="live" id="live"><i aria-hidden="true"></i><span id="upd">Every hour</span></span>
  <div class="bar-r">
    <!-- phones and tablets: the topic you're reading opens Discover (the topics); computers have them in the rail. The reading light is only this bar's round button -->
    <button type="button" class="pill pill-topic" id="topicBtn" aria-haspopup="dialog" aria-controls="disc"><span id="topicName">All news</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="button" class="round" id="lightBtn" aria-haspopup="true" aria-expanded="false" aria-label="Reading light"></button>
    <a class="bar-home" href="{{HOME}}">paiir.in<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>
  </div>
</header>

<main class="stage" id="main">
  <aside class="rail" id="rail" aria-label="Topics"></aside>
  <div class="deck" id="deck" tabindex="-1" aria-roledescription="stories" aria-label="Stories, one at a time"></div>
  <div class="nav" aria-label="Move between stories">
    <button type="button" class="up" data-go="-1" aria-label="Previous story"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button type="button" data-go="1" aria-label="Next story"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
</main>

<!-- Discover, the topics: from the left (a swipe right on a story, or the topic button) -->
<div class="ov" id="disc" hidden role="dialog" aria-modal="true" aria-labelledby="discH">
  <div class="ov-bd" data-close></div>
  <div class="disc-p">
    <div class="disc-top"><h2 id="discH">Discover</h2><button type="button" class="ib" data-close aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="disc-sc" id="discBody"></div>
  </div>
</div>

<!-- the full story: from the right (a swipe left on a story, or Read the full story) -->
<div class="ov" id="full" hidden role="dialog" aria-modal="true" aria-labelledby="fullT">
  <div class="ov-bd" data-close></div>
  <div class="full-p" id="fullP"></div>
</div>

<noscript><p style="padding:96px 24px;text-align:center">Paiir News needs JavaScript to show the stories. <a href="https://www.paiir.in/">Visit paiir.in</a></p></noscript>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{PATH}}news.js?v={{V}}" defer></script>
<script src="{{PATH}}track.js?v={{V}}" defer></script>
</body>
</html>
